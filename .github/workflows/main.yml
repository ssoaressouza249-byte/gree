name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extraindo $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d temp_extract
            INNER_DIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$INNER_DIR" ] && [ -f "$INNER_DIR/settings.gradle.kts" -o -f "$INNER_DIR/settings.gradle" ]; then
              cp -rf "$INNER_DIR"/* .
            else
              cp -rf temp_extract/* .
            fi
            rm -rf temp_extract "$ZIP_FILE"
          fi

      - name: Fix AndroidManifest and Template Cleanup
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Corrigindo atributos android:name no AndroidManifest.xml..."
            sed -i -E 's/([[:space:]])name="/\1android:name="/g' "$MANIFEST"
            sed -i -E 's/([[:space:]])exported="/\1android:exported="/g' "$MANIFEST"
            sed -i -E 's/([[:space:]])label="/\1android:label="/g' "$MANIFEST"
            sed -i -E 's/([[:space:]])theme="/\1android:theme="/g' "$MANIFEST"
            sed -i -E 's/([[:space:]])icon="/\1android:icon="/g' "$MANIFEST"
            sed -i -E 's/([[:space:]])roundIcon="/\1android:roundIcon="/g' "$MANIFEST"
            sed -i -E 's/([[:space:]])allowBackup="/\1android:allowBackup="/g' "$MANIFEST"
            sed -i -E 's/([[:space:]])supportsRtl="/\1android:supportsRtl="/g' "$MANIFEST"
            sed -i -E 's/([[:space:]])foregroundServiceType="/\1android:foregroundServiceType="/g' "$MANIFEST"
            sed -i 's/android:android:/android:/g' "$MANIFEST"
          fi

          find . -name "build.gradle*" -exec sed -i '/google-services/d' {} +
          find . -name "build.gradle*" -exec sed -i '/secrets-gradle-plugin/d' {} +
          find . -name "build.gradle*" -exec sed -i '/debug\.keystore/d' {} +

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tela-Esticada-FF-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
