name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d temp_extract
            INNER_DIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$INNER_DIR" ] && [ -f "$INNER_DIR/settings.gradle.kts" -o -f "$INNER_DIR/settings.gradle" ]; then
              cp -rf "$INNER_DIR"/* .
            else
              cp -rf temp_extract/* .
            fi
            rm -rf temp_extract "$ZIP_FILE"
          fi

      - name: Fix AndroidManifest and Gradle
        run: |
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          find . -name "build.gradle*" -exec sed -i '/google-services/d' {} +
          find . -name "build.gradle*" -exec sed -i '/\.gms\./d' {} +
          find . -name "build.gradle*" -exec sed -i '/gms/d' {} +
          find . -name "build.gradle*" -exec sed -i '/secrets-gradle-plugin/d' {} +
          find . -name "build.gradle*" -exec sed -i '/debug\.keystore/d' {} +

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
